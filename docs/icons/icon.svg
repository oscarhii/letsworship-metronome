<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#141c38"/>
      <stop offset="100%" stop-color="#0d1326"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0844"/>
      <stop offset="100%" stop-color="#ffb199"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded box -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  
  <!-- Outer subtle pulse ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#00f2fe" stroke-width="3" stroke-dasharray="8 8" opacity="0.4"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="#4facfe" stroke-width="4" opacity="0.2"/>

  <!-- Metronome Body -->
  <path d="M190 380 L230 140 Q256 120 282 140 L322 380 Q256 400 190 380 Z" fill="#1b2447" stroke="#334177" stroke-width="5"/>
  
  <!-- Dial Arc -->
  <path d="M210 240 Q256 220 302 240" fill="none" stroke="#00f2fe" stroke-width="4" opacity="0.7"/>

  <!-- Pendulum Arm swinging -->
  <line x1="256" y1="360" x2="330" y2="150" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Pendulum Weight (Glowing) -->
  <circle cx="310" cy="205" r="24" fill="url(#neonPink)" filter="url(#glow)"/>
  <circle cx="310" cy="205" r="16" fill="#ffffff" opacity="0.8"/>

  <!-- Center Pivot -->
  <circle cx="256" cy="360" r="14" fill="#00f2fe" filter="url(#glow)"/>

  <!-- Wi-Fi Sync Waves at the top -->
  <path d="M216 90 Q256 60 296 90" fill="none" stroke="url(#accentGrad)" stroke-width="7" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M232 110 Q256 90 280 110" fill="none" stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <circle cx="256" cy="125" r="5" fill="#00f2fe"/>
</svg>
