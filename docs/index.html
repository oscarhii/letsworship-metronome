<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Sub-millisecond synchronized metronome for bands & ensembles over local Wi-Fi. Works seamlessly on iOS Safari, Android Chrome, and Desktop.">
  <meta name="theme-color" content="#0a0e1a">

  <!-- iOS PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SyncBeat">
  <link rel="apple-touch-icon" href="./icons/icon.svg">

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="stylesheet" href="./css/style.css">

  <title>Sync Metronome • Wi-Fi Beat Synchronizer</title>
</head>
<body>
  <!-- Visual Screen Flash Overlay -->
  <div id="flash-overlay"></div>

  <main class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 32 32" fill="none">
          <circle cx="16" cy="16" r="14" stroke="#00f2fe" stroke-width="2" stroke-dasharray="4 2"/>
          <path d="M12 24 L16 8 L20 24 Z" fill="#4facfe"/>
          <circle cx="16" cy="14" r="3" fill="#00f2fe"/>
        </svg>
        <h1 class="brand-title">SYNC BEAT</h1>
      </div>

      <div class="header-actions">
        <div class="status-pill" id="status-pill">
          <span class="status-dot"></span>
          <span id="status-text">Connecting...</span>
        </div>

        <button class="btn-icon" id="btn-qr-modal" title="Wi-Fi QR Code / Share" aria-label="Share Wi-Fi QR Code">
          <svg viewBox="0 0 24 24">
            <path d="M4 4h6v6H4V4zm2 2v2h2V6H6zm8-2h6v6h-6V4zm2 2v2h2V6h-2zM4 14h6v6H4v-6zm2 2v2h2v-2H6zm10 0h2v2h-2v-2zm2-2h2v2h-2v-2zm-4 4h2v2h-2v-2zm4 0h2v2h-2v-2zm-2-2h2v2h-2v-2zM14 10h2v2h-2v-2zm-4 0h2v2h-2v-2z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Metronome Centerpiece -->
    <section class="card-main">
      <div class="top-meta">
        <span class="tempo-marking" id="tempo-marking">Allegro</span>
        <span class="room-badge" id="room-badge" title="Click to switch room">Room: MAIN</span>
      </div>

      <!-- BPM Circular Dial & Display -->
      <div class="bpm-dial-wrapper">
        <svg class="dial-svg" viewBox="0 0 200 200">
          <defs>
            <linearGradient id="dialGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#00f2fe"/>
              <stop offset="100%" stop-color="#ff0844"/>
            </linearGradient>
          </defs>
          <circle class="dial-bg" cx="100" cy="100" r="90" />
          <circle class="dial-progress" id="dial-progress" cx="100" cy="100" r="90" />
        </svg>

        <div class="bpm-center">
          <div class="bpm-value" id="bpm-display">120</div>
          <div class="bpm-label">BPM</div>
        </div>
      </div>

      <!-- Beat Dots Visual Indicator -->
      <div class="beat-dots-container" id="beat-dots">
        <div class="beat-dot accent-spot"></div>
        <div class="beat-dot"></div>
        <div class="beat-dot"></div>
        <div class="beat-dot"></div>
      </div>

      <!-- Stepper Controls (Fine Tuning) -->
      <div class="stepper-row">
        <button class="btn-step" id="btn-minus-5" aria-label="Decrease 5 BPM">-5</button>
        <button class="btn-step" id="btn-minus-1" aria-label="Decrease 1 BPM">-1</button>
        <button class="btn-step" id="btn-plus-1" aria-label="Increase 1 BPM">+1</button>
        <button class="btn-step" id="btn-plus-5" aria-label="Increase 5 BPM">+5</button>
      </div>

      <!-- Tempo Slider -->
      <div class="slider-container">
        <input type="range" class="tempo-slider" id="tempo-slider" min="30" max="280" value="120" aria-label="Tempo Slider">
      </div>

      <!-- Tap Tempo -->
      <div class="tap-tempo-row">
        <button class="btn-tap" id="btn-tap-tempo">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/>
          </svg>
          TAP TEMPO
        </button>
      </div>

      <!-- Synchronized Play / Stop Master Button -->
      <div class="play-control-row">
        <button class="btn-play-sync" id="btn-play-sync">
          <svg id="play-icon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="5 3 19 12 5 21 5 3"/>
          </svg>
          <span id="play-text">START SYNC</span>
        </button>
      </div>
    </section>

    <!-- Secondary Settings Card -->
    <section class="card-secondary">
      <!-- Beats Per Measure (Time Signature) -->
      <div class="setting-group">
        <span class="setting-label">Beats / Bar</span>
        <div class="segmented-control">
          <button class="segment-btn" data-beats="2">2/4</button>
          <button class="segment-btn" data-beats="3">3/4</button>
          <button class="segment-btn active" data-beats="4">4/4</button>
          <button class="segment-btn" data-beats="6">6/8</button>
        </div>
      </div>

      <!-- Sync Mode -->
      <div class="setting-group">
        <span class="setting-label">Sync Network</span>
        <select id="mode-select" style="background: rgba(10,14,26,0.8); color: var(--accent-cyan); border: 1px solid rgba(255,255,255,0.15); padding: 6px 12px; border-radius: var(--radius-sm); font-weight: 600; outline: none; cursor: pointer;">
          <option value="webrtc">WebRTC P2P (No Server)</option>
          <option value="websocket">Local Wi-Fi Server</option>
        </select>
      </div>

      <!-- Sound Style -->
      <div class="setting-group">
        <span class="setting-label">Click Sound</span>
        <select id="sound-select" style="background: rgba(10,14,26,0.8); color: var(--accent-cyan); border: 1px solid rgba(255,255,255,0.15); padding: 6px 12px; border-radius: var(--radius-sm); font-weight: 600; outline: none; cursor: pointer;">
          <option value="synth">Electronic Beep</option>
          <option value="woodblock">Woodblock</option>
          <option value="rimshot">Rimshot</option>
        </select>
      </div>

      <!-- Visual Flash on Beat -->
      <div class="setting-group">
        <span class="setting-label">Screen Visual Flash</span>
        <label class="toggle-switch">
          <input type="checkbox" id="flash-toggle" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>

      <!-- Keep Screen Awake (Wake Lock) -->
      <div class="setting-group">
        <span class="setting-label">Keep Screen Awake</span>
        <label class="toggle-switch">
          <input type="checkbox" id="wakelock-toggle" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>
    </section>
  </main>

  <!-- Wi-Fi / Room QR Code Modal -->
  <div class="modal-backdrop" id="qr-modal">
    <div class="modal-dialog">
      <h2 class="modal-title">📱 Sync with Other Phones</h2>
      <p class="modal-desc">Share this link or scan the QR Code on other phones to beat together in the same room:</p>
      
      <div id="adapter-select-container" style="width: 100%; display: none; flex-direction: column; gap: 6px; text-align: left;">
        <label for="network-select" style="font-size: 0.8rem; color: var(--text-muted); font-weight: 600;">Selected Network Adapter:</label>
        <select id="network-select" style="width: 100%; background: rgba(10,14,26,0.9); color: var(--accent-cyan); border: 1px solid rgba(0,242,254,0.3); padding: 8px 12px; border-radius: var(--radius-sm); font-size: 0.85rem; font-weight: 600; outline: none; cursor: pointer;"></select>
      </div>

      <div class="qr-frame" id="qr-frame-box">
        <div id="qrcode-canvas-container"></div>
      </div>

      <div class="network-url-box">
        <input type="text" id="wifi-url-input" readonly value="">
        <button class="btn-step" id="btn-copy-url" style="padding: 4px 10px; font-size: 0.75rem;">Copy</button>
      </div>

      <button class="btn-modal-close" id="btn-close-qr">Close</button>
    </div>
  </div>

  <!-- iOS / Mobile Audio Unlock Prompt Banner -->
  <div class="audio-unlock-banner" id="audio-unlock-banner">
    <span>🔊 Tap here to activate audio on this device</span>
    <span>👉</span>
  </div>

  <!-- Scripts -->
  <script src="./js/peerjs.min.js"></script>
  <script src="./js/qrcode.min.js"></script>
  <script src="./js/audio.js"></script>
  <script src="./js/sync.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
